name: RTSP to YouTube Stream
version: "2.2.2"
slug: rtsp_to_youtube
description: Stream an RTSP camera directly to YouTube Live with auto-restart and health monitoring
startup: services
boot: auto
arch:
  - aarch64
  - amd64
host_network: true
options:
  rtsp_url: ""
  youtube_key: ""
  bitrate: "2500k"
  rtsp_timeout: "15"
  reconnect_delay: "5"
schema:
  rtsp_url: str
  youtube_key: password
  bitrate: str
  rtsp_timeout: str
  reconnect_delay: str
